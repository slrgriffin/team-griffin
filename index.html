<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // GitHub Pages doesn't allow custom Cache-Control headers, so any cached
  // copy of this page (browser or CDN) can go stale after we push updates.
  // Force every load to be a genuinely fresh network fetch by navigating to
  // a URL with a unique query string — impossible for any cache to already
  // have an entry for. Runs before anything else loads.
  if (!location.search.includes('v=')) {
    location.replace(location.pathname + '?v=' + Date.now());
  }
</script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Griffin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4D3;
    --paper-deep:#E3D7C0;
    --ink:#2B2B26;
    --ink-soft:#5B564C;
    --pine:#2F4538;
    --pine-deep:#233327;
    --nollen:#C1652F;
    --austin:#3B6E8F;
    --family:#8A6A2F;
    --line:#C9BB9E;
    --card:#FBF8F1;
    --good:#4C7A52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,0.04), transparent 45%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 0 3rem;}

  header{
    background:linear-gradient(180deg,var(--pine) 0%,var(--pine-deep) 100%);
    color:#F3EEE1;
    padding:1.75rem 1.5rem 1.5rem;
    border-bottom:4px solid #1a251d;
  }
  .eyebrow{
    font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:#B9C9BB;font-weight:600;margin-bottom:.35rem;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:2rem;
    margin:0 0 .15rem;letter-spacing:-.01em;
  }
  .week-range{color:#D8CFB6;font-size:.9rem;margin-bottom:1.1rem;}

  .progress-row{display:flex;align-items:center;gap:.75rem;}
  .progress-track{
    flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  .progress-fill{height:100%;background:#D9A441;border-radius:5px;transition:width .4s ease;}
  .progress-label{font-size:.72rem;color:#D8CFB6;white-space:nowrap;font-variant-numeric:tabular-nums;}

  main{padding:1.5rem 1.25rem 0;}

  .section-label{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;
    color:var(--pine-deep);margin:1.75rem 0 .75rem;display:flex;align-items:center;gap:.5rem;
  }
  .section-label:first-child{margin-top:0;}

  .day-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    margin-bottom:.85rem;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .day-card.today{border-color:var(--pine);box-shadow:0 0 0 2px rgba(47,69,56,.15);}
  .day-head{
    display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;
    border-bottom:1px dashed var(--line);background:rgba(0,0,0,.015);
  }
  .day-badge{
    width:2.5rem;height:2.5rem;border-radius:50%;background:var(--pine);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:'Fraunces',serif;font-weight:600;line-height:1;flex-shrink:0;
  }
  .day-badge .num{font-size:1rem;}
  .day-badge .mon{font-size:.55rem;text-transform:uppercase;letter-spacing:.04em;opacity:.85;}
  .day-name{font-weight:600;font-size:.95rem;}
  .today-pill{
    margin-left:auto;background:var(--pine);color:#fff;font-size:.65rem;font-weight:700;
    letter-spacing:.06em;padding:.2rem .5rem;border-radius:99px;text-transform:uppercase;
  }
  .day-body{padding:.75rem .9rem .85rem;}
  .day-tasks{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem .9rem .75rem;border-top:1px dashed var(--line);}
  .task-chip{
    display:flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;
    padding:.3rem .6rem;border-radius:99px;background:var(--paper-deep);color:var(--ink-soft);
    cursor:pointer;border:1px solid var(--line);user-select:none;transition:.15s;
  }
  .task-chip .dot{width:.55rem;height:.55rem;border-radius:50%;border:2px solid var(--ink-soft);flex-shrink:0;}
  .task-chip.done{background:var(--good);color:#fff;border-color:var(--good);}
  .task-chip.done .dot{background:#fff;border-color:#fff;}
  .task-chip.pending{opacity:.55;}
  .task-chip.unconfirmed{border-color:#B8492F;box-shadow:0 0 0 1px #B8492F inset;}
  .check-row.pending{opacity:.5;pointer-events:none;}
  .check-row.unconfirmed{background:rgba(184,73,47,.08);}
  .tiny-warn{font-size:.68rem;color:#B8492F;font-weight:600;margin-top:.3rem;}
  .vac-banner{
    padding:.75rem .9rem;font-size:.9rem;font-weight:500;color:var(--ink);
    background:repeating-linear-gradient(135deg,rgba(217,164,65,.16),rgba(217,164,65,.16) 10px,rgba(217,164,65,.28) 10px,rgba(217,164,65,.28) 20px);
  }
  .person-row{display:flex;gap:.5rem;margin-bottom:.45rem;align-items:flex-start;}
  .person-row:last-child{margin-bottom:0;}
  .person-tag{
    flex-shrink:0;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:.2rem .45rem;border-radius:5px;color:#fff;margin-top:.05rem;
  }
  .tag-n{background:var(--nollen);}
  .tag-a{background:var(--austin);}
  .tag-f{background:var(--family);}
  .person-items{font-size:.85rem;color:var(--ink-soft);line-height:1.5;}
  .free-day{font-size:.85rem;color:var(--ink-soft);font-style:italic;}

  .checklist-box{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;
  }
  .check-row{
    display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .5rem;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .check-row:last-child{border-bottom:none;}
  .check-box{
    width:1.15rem;height:1.15rem;border-radius:5px;border:2px solid var(--ink-soft);
    flex-shrink:0;margin-top:.1rem;display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .check-row.done .check-box{background:var(--good);border-color:var(--good);}
  .check-box svg{width:.7rem;height:.7rem;opacity:0;transition:.15s;}
  .check-row.done .check-box svg{opacity:1;}
  .check-label{font-size:.87rem;line-height:1.4;}
  .check-row.done .check-label{color:var(--ink-soft);text-decoration:line-through;}
  .empty-note{font-size:.8rem;color:var(--ink-soft);font-style:italic;padding:.5rem;}
  .hint{font-size:.74rem;color:var(--ink-soft);margin-top:.5rem;padding:0 .1rem;line-height:1.4;}

  .state-msg{padding:2.5rem 1rem;text-align:center;color:var(--ink-soft);font-size:.9rem;}
  footer{
    text-align:center;padding:1.5rem 1.25rem 0;font-size:.72rem;color:var(--ink-soft);
  }
  footer a{color:var(--pine);}
  .refresh-btn{
    background:none;border:1px solid var(--line);color:var(--pine-deep);font-size:.75rem;
    padding:.35rem .8rem;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600;
  }
  .refresh-btn:hover{background:rgba(0,0,0,.03);}

  .tabs{display:flex;gap:.5rem;padding:1rem 1.25rem 0;}
  .tab-btn{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:.55rem;font-family:inherit;font-weight:600;font-size:.85rem;color:var(--ink-soft);
    cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--pine);color:#fff;border-color:var(--pine);}

  .tt-legend{font-size:.72rem;color:var(--ink-soft);margin:0 0 1rem;line-height:1.5;}
  .tt-swatch{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin:0 .2rem -.05rem 0;}

  .tt-filters{padding:0 0 1rem;}
  .tt-filter-group{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem;}
  .tt-filter-chip{
    font-size:.72rem;font-weight:600;padding:.32rem .7rem;border-radius:99px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    cursor:pointer;font-family:inherit;
  }
  .tt-filter-chip.active{background:var(--pine);color:#fff;border-color:var(--pine);}
  .tt-toggle{
    display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;
    color:var(--ink-soft);cursor:pointer;margin-top:.2rem;
  }
  .tt-toggle input{width:1rem;height:1rem;accent-color:var(--pine);}

  .timetable{
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);
    margin-bottom:1.5rem;
  }
  .tt-header{display:flex;background:var(--paper-deep);border-bottom:1px solid var(--line);}
  .tt-time-col-h{width:44px;flex-shrink:0;}
  .tt-day-col-h{
    flex:1;text-align:center;font-size:.68rem;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;color:var(--pine-deep);padding:.5rem .15rem;border-left:1px solid var(--line);
  }
  .tt-body{display:flex;position:relative;}
  .tt-time-col{width:44px;flex-shrink:0;position:relative;border-right:1px solid var(--line);}
  .tt-hour-label{
    position:absolute;left:0;right:0;transform:translateY(-50%);
    font-size:.6rem;color:var(--ink-soft);text-align:right;padding-right:.35rem;white-space:nowrap;
  }
  .tt-day-col{
    flex:1;position:relative;border-left:1px solid var(--line);
    background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent 90px);
  }
  .tt-activity{
    position:absolute;border-radius:4px;padding:.15rem .3rem;overflow:hidden;
    font-size:.6rem;line-height:1.15;box-sizing:border-box;border:1px solid;cursor:pointer;
  }
  .tt-activity:hover{filter:brightness(0.95);box-shadow:0 0 0 2px rgba(47,69,56,.3);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(35,51,39,.45);display:flex;
    align-items:center;justify-content:center;z-index:1000;padding:1rem;
  }
  .modal-box{
    background:var(--card);border-radius:12px;padding:1.4rem;max-width:340px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .modal-box h3{margin:0 0 1rem;font-family:'Fraunces',serif;font-weight:600;color:var(--pine-deep);font-size:1.1rem;}
  .modal-field{display:block;font-size:.72rem;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:.9rem;}
  .modal-field input, .modal-field select{
    display:block;width:100%;margin-top:.35rem;padding:.5rem .55rem;border:1px solid var(--line);
    border-radius:6px;font-family:'Inter',sans-serif;font-size:.9rem;box-sizing:border-box;color:var(--ink);
    text-transform:none;font-weight:400;letter-spacing:normal;background:#fff;
  }
  .modal-row{display:flex;gap:.6rem;}
  .modal-row .modal-field{flex:1;}
  .modal-actions{display:flex;gap:.5rem;margin-top:.4rem;}
  .modal-actions button{
    flex:1;padding:.6rem;border-radius:8px;border:1px solid var(--line);font-family:inherit;
    font-weight:600;cursor:pointer;font-size:.85rem;background:var(--card);color:var(--ink-soft);
  }
  .modal-actions button.primary{background:var(--pine);color:#fff;border-color:var(--pine);}
  .modal-actions button:disabled{opacity:.5;cursor:default;}
  #modal-status{font-size:.72rem;margin-top:.7rem;text-align:center;color:var(--ink-soft);min-height:1em;}
  #modal-status.err{color:#B8492F;font-weight:600;}
  #modal-status.ok{color:var(--good);font-weight:600;}
  .tt-activity.tt-n.tt-picked{background:rgba(193,101,47,.20);border-color:var(--nollen);}
  .tt-activity.tt-a.tt-picked{background:rgba(59,110,143,.20);border-color:var(--austin);}
  .tt-activity.tt-conflict{
    background:repeating-linear-gradient(135deg,rgba(184,73,47,.10),rgba(184,73,47,.10) 4px,rgba(184,73,47,.20) 4px,rgba(184,73,47,.20) 8px);
    border:1px dashed #B8492F;
  }
  .tt-act-name{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tt-act-time{color:var(--ink-soft);white-space:nowrap;overflow:hidden;font-size:.56rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Team Griffin</div>
    <h1 id="week-title">This Week</h1>
    <div class="week-range" id="week-range">Loading…</div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">Summer &rsquo;26</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-week">📅 This Week</button>
    <button class="tab-btn" id="tab-btn-activities">⚙️ Activities</button>
  </div>

  <main id="main">
    <div class="state-msg" id="loading">Loading schedule…</div>
  </main>
  <div id="activities-panel" style="display:none;padding:0 1.25rem;"></div>

  <footer>
    <div id="sync-note">—</div>
    <div style="margin-top:.6rem"><button class="refresh-btn" id="refresh-btn">↻ Refresh</button></div>
  </footer>
</div>

<script>
const RAW_JSON_URL = 'https://raw.githubusercontent.com/slrgriffin/team-griffin/main/schedule.json';
const SEASON_START = '2026-06-15';
const SEASON_END   = '2026-08-14';
const DAY_MS = 86400000;

function isoDate(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function dayName(d){ return d.toLocaleDateString('en-US',{weekday:'long'}); }
function monthAbbr(d){ return d.toLocaleDateString('en-US',{month:'short'}); }

function mondayOf(d){
  const dow = d.getDay(); // 0 Sun..6 Sat
  const diff = dow === 0 ? 6 : dow - 1;
  const m = new Date(d);
  m.setDate(d.getDate() - diff);
  m.setHours(0,0,0,0);
  return m;
}

const today = new Date();
today.setHours(0,0,0,0);
const todayStr = isoDate(today);
const weekMonday = mondayOf(today);
const weekMondayStr = isoDate(weekMonday);

function renderPersonRow(cls, tag, items){
  if(!items || !items.length) return '';
  return `<div class="person-row">
    <span class="person-tag ${cls}">${tag}</span>
    <span class="person-items">${items.join(' &nbsp;·&nbsp; ')}</span>
  </div>`;
}

function renderDayCard(date, data){
  const dStr = isoDate(date);
  const isToday = dStr === todayStr;
  const override = (data.dateOverrides || {})[dStr];
  const dn = dayName(date);

  let bodyHtml;
  if(override && override.vac){
    bodyHtml = `<div class="vac-banner">${override.vac}</div>`;
  } else {
    const day = override || (data.weeklyPattern || {})[dn] || {n:[],a:[],f:[]};
    const rows = [
      renderPersonRow('tag-n','Nollen', day.n),
      renderPersonRow('tag-a','Austin', day.a),
      renderPersonRow('tag-f','Family', day.f),
    ].join('');
    bodyHtml = rows
      ? `<div class="day-body">${rows}</div>`
      : `<div class="day-body"><div class="free-day">Nothing scheduled</div></div>`;
  }

  const doneMap = (data.taskCompletions||{})[dStr] || {};
  const tasksHtml = (data.dailyReminders||[]).map((t) => {
    const short = t.label.replace(/^Remember to /i, '');
    const isDone = !!doneMap[t.id];
    return `<div class="task-chip${isDone?' done':''}" data-task-date="${dStr}" data-task-id="${t.id}">
      <span class="dot"></span>${short}
    </div>`;
  }).join('');

  return `<div class="day-card${isToday ? ' today':''}">
    <div class="day-head">
      <div class="day-badge"><span class="num">${date.getDate()}</span><span class="mon">${monthAbbr(date)}</span></div>
      <div class="day-name">${dn}</div>
      ${isToday ? '<div class="today-pill">Today</div>' : ''}
    </div>
    ${bodyHtml}
    <div class="day-tasks">${tasksHtml}</div>
  </div>`;
}

// ── Checklist actions write straight to schedule.json via Apps Script,
//    which holds the GitHub token server-side. The browser never sees it.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw76raQJy3ermBwW4rpBbSR6LCMGztbj-vL4R-LPqBmp6an_jaDp6l4clOPje6F-NJu2A/exec';

// Action items: checking marks completed:true in schedule.json (kept, not deleted).
// Only not-yet-completed items are shown, but data-i preserves the item's real
// position in the underlying array so the write targets the right element.
function renderActionItems(items, week){
  const el = document.getElementById('action-items');
  const pending = (items||[]).map((item,i) => ({...item, i})).filter(x => !x.completed);
  if(!pending.length){
    el.innerHTML = '<div class="empty-note">No action items this week.</div>';
    return;
  }
  el.innerHTML = pending.map(({text,i}) => `<div class="check-row" data-i="${i}" data-week="${week}">
    <div class="check-box"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="check-label">${text}</div>
  </div>`).join('');
}

// Polls the raw JSON (cache-busted each try) until `checkFn` confirms the
// write actually landed, or gives up after ~40s and flags it as unconfirmed.
async function confirmWrite(el, checkFn, onConfirmed, onGaveUp){
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,5000));
    try{
      const res = await fetch(RAW_JSON_URL + '?t=' + Date.now());
      if(res.ok){
        const d = await res.json();
        if(checkFn(d)){ onConfirmed(); return; }
      }
    }catch(e){ /* keep polling */ }
  }
  onGaveUp();
}

// One delegated handler covers both day-card task chips and action items,
// since #main's contents get replaced each render() but #main itself does not.
document.getElementById('main').addEventListener('click', (e) => {
  const chip = e.target.closest('.task-chip');
  if(chip){
    if(chip.dataset.pending) return; // already confirming a previous tap
    chip.dataset.pending = '1';
    chip.classList.remove('unconfirmed');
    chip.classList.add('pending');
    const date = chip.dataset.taskDate, taskId = chip.dataset.taskId;
    chip.classList.toggle('done'); // optimistic flip, verified below
    const expectDone = chip.classList.contains('done');
    fetch(`${SCRIPT_URL}?mode=toggleTask&date=${date}&taskId=${taskId}`, { mode: 'no-cors' }).catch(()=>{});

    confirmWrite(
      chip,
      (d) => !!((d.taskCompletions||{})[date]||{})[taskId] === expectDone,
      () => { chip.classList.remove('pending'); delete chip.dataset.pending; },
      () => {
        chip.classList.remove('pending');
        chip.classList.add('unconfirmed');
        delete chip.dataset.pending;
      }
    );
    return;
  }

  const row = e.target.closest('.check-row');
  if(row){
    if(row.dataset.pending) return;
    row.dataset.pending = '1';
    row.classList.add('pending');
    const i = Number(row.dataset.i), week = row.dataset.week;
    fetch(`${SCRIPT_URL}?mode=completeAction&week=${week}&index=${i}`, { mode: 'no-cors' }).catch(()=>{});

    confirmWrite(
      row,
      (d) => !!(((d.weeklyNotes||{})[week]||[])[i]||{}).completed,
      () => row.remove(),
      () => {
        row.classList.remove('pending');
        row.classList.add('unconfirmed');
        delete row.dataset.pending;
        if(!row.querySelector('.tiny-warn')){
          row.insertAdjacentHTML('beforeend', '<div class="tiny-warn">Didn\'t confirm — try again?</div>');
        }
      }
    );
  }
});

function render(data){
  document.getElementById('loading')?.remove?.();

  const sunday = new Date(weekMonday); sunday.setDate(weekMonday.getDate()+6);
  document.getElementById('week-range').textContent =
    `${weekMonday.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${sunday.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;

  const weekNum = Math.floor((weekMonday - parseISO(SEASON_START)) / (7*DAY_MS)) + 1;
  document.getElementById('week-title').textContent = `Week ${weekNum} of 9`;

  const start = parseISO(SEASON_START), end = parseISO(SEASON_END);
  const pct = Math.min(100, Math.max(0, ((today-start)/(end-start))*100));
  const dayNum = Math.round((today-start)/DAY_MS)+1;
  const totalDays = Math.round((end-start)/DAY_MS)+1;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `Day ${dayNum} of ${totalDays} · Jun 15 – Aug 14`;

  let cardsHtml = '';
  for(let i=0;i<7;i++){
    const d = new Date(weekMonday); d.setDate(weekMonday.getDate()+i);
    cardsHtml += renderDayCard(d, data);
  }

  document.getElementById('main').innerHTML = `
    <div class="section-label">📅 This Week</div>
    ${cardsHtml}
    <div class="section-label">✅ Action Items</div>
    <div class="checklist-box" id="action-items"></div>
    <div class="hint">Tap a task or action item and it saves to the shared schedule for everyone. It dims briefly while confirming (~10–40s); if a red outline appears instead, it didn't land — try again.</div>
  `;

  renderActionItems((data.weeklyNotes||{})[weekMondayStr], weekMondayStr);
  renderActivitiesTab(data);

  document.getElementById('sync-note').textContent =
    `Synced from GitHub · ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
}

function renderError(msg){
  document.getElementById('main').innerHTML = `<div class="state-msg">⚠️ ${msg}</div>`;
  document.getElementById('week-range').textContent = 'Unable to load';
}

// ── Activity options & optimizer ──────────────────────────────────
// Classic activity-selection algorithm: sort by end time, greedily keep
// each option that doesn't overlap the last one kept. This is proven to
// maximize the number of non-conflicting activities that can be kept —
// it's the same approach used for interval scheduling generally.
function timeToMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }

function formatTime12(t){
  const [h,m]=t.split(':').map(Number);
  const ampm = h>=12 ? 'pm':'am';
  const hh = ((h+11)%12)+1;
  return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
}

// Activities already actually chosen (matching the real weekly pattern) are
// locked in first — the optimizer shouldn't suggest swapping out a decision
// that's already been made. Remaining time is then filled greedily with
// whatever additional non-conflicting alternatives fit, by earliest end time.
function optimizePicks(list){
  const withIdx = list.map((a,i)=>({...a, i}));
  const overlaps = (a,b) => timeToMinutes(a.start) < timeToMinutes(b.end) && timeToMinutes(b.start) < timeToMinutes(a.end);

  const preferred = withIdx.filter(a=>a.preferred);
  const alts = withIdx.filter(a=>!a.preferred).sort((a,b)=>timeToMinutes(a.end)-timeToMinutes(b.end));

  const picked = new Set(preferred.map(a=>a.i));
  const lockedIn = [...preferred];
  for(const alt of alts){
    if(!lockedIn.some(p => overlaps(alt,p))){
      picked.add(alt.i);
      lockedIn.push(alt);
    }
  }
  return picked;
}

function hasAnyConflict(list, i){
  const a = list[i];
  const aS = timeToMinutes(a.start), aE = timeToMinutes(a.end);
  return list.some((b,j)=>{
    if(j===i) return false;
    const bS = timeToMinutes(b.start), bE = timeToMinutes(b.end);
    return aS < bE && bS < aE;
  });
}

const PX_PER_MIN = 1.5;
let currentData = null;
let filterState = { people: new Set(['Nollen','Austin']), types: null, optimizedOnly: true };

// Assigns overlapping activities to side-by-side lanes within one child's half
// of a day column (same technique day-view calendars use for conflicting events).
function assignLanes(activities){
  const withMin = activities.map((a,i)=>({...a, i, sMin:timeToMinutes(a.start), eMin:timeToMinutes(a.end)}))
    .sort((a,b)=>a.sMin-b.sMin);
  const laneEnds = [];
  withMin.forEach(act => {
    let lane = laneEnds.findIndex(end => end <= act.sMin);
    if(lane === -1){ lane = laneEnds.length; laneEnds.push(act.eMin); }
    else laneEnds[lane] = act.eMin;
    act.lane = lane;
  });
  return { items: withMin, laneCount: Math.max(1, laneEnds.length) };
}

// Tags each activity with whether the optimizer picked it — computed on the
// FULL list before any display filtering, so hiding a type/person never
// changes what counts as an actual conflict.
function tagPicked(list){
  const picked = optimizePicks(list);
  return list.map((a,i)=>({...a, _picked: picked.has(i)}));
}

function passesFilters(a){
  if(!filterState.people.has(a.child)) return false;
  if(filterState.types && !filterState.types.has(a.type||'Other')) return false;
  if(filterState.optimizedOnly && !a._picked) return false;
  return true;
}

function layoutChild(activitiesTagged, rangeStartMin, rangeEndMin, leftPct, widthPct){
  const visible = activitiesTagged.filter(passesFilters);
  if(!visible.length) return '';
  const { items, laneCount } = assignLanes(visible);
  return items.map(act => {
    const cStart = Math.max(rangeStartMin, act.sMin), cEnd = Math.min(rangeEndMin, act.eMin);
    if(cEnd <= cStart) return '';
    const top = (cStart - rangeStartMin) * PX_PER_MIN;
    const height = Math.max(14, (cEnd - cStart) * PX_PER_MIN);
    const laneW = widthPct / laneCount;
    const left = leftPct + act.lane * laneW;
    const cls = act._picked ? 'tt-picked' : 'tt-conflict';
    const childCls = act.child==='Nollen' ? 'tt-n' : 'tt-a';
    const tip = `${act.child}: ${act.name} · ${formatTime12(act.start)}–${formatTime12(act.end)} @ ${act.location}`;
    return `<div class="tt-activity ${cls} ${childCls}" style="top:${top}px;height:${height}px;left:${left}%;width:${laneW-1}%" title="${tip}" data-day="${act._day}" data-index="${act._origIndex}">
      <div class="tt-act-name">${act.name}</div>
      <div class="tt-act-time">${formatTime12(act.start)}–${formatTime12(act.end)}</div>
    </div>`;
  }).join('');
}

function buildTimetable(title, days, rangeStart, rangeEnd, data){
  const startMin = timeToMinutes(rangeStart), endMin = timeToMinutes(rangeEnd);
  const totalMin = endMin - startMin;
  const height = totalMin * PX_PER_MIN;

  let labels = '';
  for(let m = 0; m <= totalMin; m += 60){
    const t = startMin + m;
    const hh = String(Math.floor(t/60)).padStart(2,'0'), mm = String(t%60).padStart(2,'0');
    labels += `<div class="tt-hour-label" style="top:${m*PX_PER_MIN}px">${formatTime12(hh+':'+mm)}</div>`;
  }

  const opts = data.activityOptions || {};
  const dayCols = days.map(day => {
    const acts = (opts[day] || []).map((a,i)=>({...a, _day:day, _origIndex:i}));
    const nollen = tagPicked(acts.filter(a=>a.child==='Nollen'));
    const austin = tagPicked(acts.filter(a=>a.child==='Austin'));
    const body = layoutChild(nollen, startMin, endMin, 1, 48) + layoutChild(austin, startMin, endMin, 51, 48);
    return `<div class="tt-day-col" style="height:${height}px">${body}</div>`;
  }).join('');

  const headerCols = days.map(d => `<div class="tt-day-col-h">${d.slice(0,3)}</div>`).join('');

  return `<div class="section-label">${title}</div>
  <div class="timetable">
    <div class="tt-header"><div class="tt-time-col-h"></div>${headerCols}</div>
    <div class="tt-body">
      <div class="tt-time-col" style="height:${height}px">${labels}</div>
      ${dayCols}
    </div>
  </div>`;
}

function getAllTypes(data){
  const types = new Set();
  Object.values(data.activityOptions||{}).forEach(acts => acts.forEach(a => types.add(a.type||'Other')));
  return [...types].sort();
}

function renderFilterBar(data){
  const types = getAllTypes(data);
  if(filterState.types === null){ filterState.types = new Set(types); } // default: all types on

  const peopleChips = ['Nollen','Austin'].map(p =>
    `<button class="tt-filter-chip${filterState.people.has(p)?' active':''}" data-filter="people" data-val="${p}">${p}</button>`
  ).join('');
  const typeChips = types.map(t =>
    `<button class="tt-filter-chip${filterState.types.has(t)?' active':''}" data-filter="types" data-val="${t}">${t}</button>`
  ).join('');

  return `<div class="tt-filters">
    <label class="tt-toggle" style="margin:0 0 .6rem">
      <input type="checkbox" id="filter-optimized" ${filterState.optimizedOnly?'checked':''}> Optimized schedule only (hide conflicts)
    </label>
    <div class="tt-filter-group">${peopleChips}</div>
    <div class="tt-filter-group">${typeChips}</div>
  </div>`;
}

document.getElementById('activities-panel').addEventListener('click', (e) => {
  const chip = e.target.closest('.tt-filter-chip');
  if(chip){
    const group = filterState[chip.dataset.filter];
    const val = chip.dataset.val;
    if(group.has(val)) group.delete(val); else group.add(val);
    if(currentData) renderActivitiesTab(currentData);
    return;
  }
  const block = e.target.closest('.tt-activity');
  if(block) openActivityModal(block.dataset.day, Number(block.dataset.index));
});
document.getElementById('activities-panel').addEventListener('change', (e) => {
  if(e.target.id === 'filter-optimized'){
    filterState.optimizedOnly = e.target.checked;
    if(currentData) renderActivitiesTab(currentData);
  }
});

// ── Edit-activity modal ────────────────────────────────────────────
let modalTarget = null; // { day, index }

function openActivityModal(day, index){
  const item = (currentData.activityOptions[day] || [])[index];
  if(!item) return;
  modalTarget = { day, index };
  document.getElementById('modal-name').value = item.name;
  document.getElementById('modal-child').value = item.child;
  document.getElementById('modal-type').value = item.type || 'Other';
  document.getElementById('modal-start').value = item.start;
  document.getElementById('modal-end').value = item.end;
  const statusEl = document.getElementById('modal-status');
  statusEl.textContent = '';
  statusEl.className = '';
  document.getElementById('modal-save').disabled = false;
  document.getElementById('activity-modal').style.display = 'flex';
}

function closeActivityModal(){
  document.getElementById('activity-modal').style.display = 'none';
  modalTarget = null;
}

document.getElementById('modal-cancel').addEventListener('click', closeActivityModal);
document.getElementById('activity-modal').addEventListener('click', (e) => {
  if(e.target.id === 'activity-modal') closeActivityModal(); // click outside the box
});

document.getElementById('modal-save').addEventListener('click', async () => {
  if(!modalTarget) return;
  const { day, index } = modalTarget;
  const name = document.getElementById('modal-name').value.trim();
  const child = document.getElementById('modal-child').value;
  const type = document.getElementById('modal-type').value;
  const start = document.getElementById('modal-start').value;
  const end = document.getElementById('modal-end').value;
  const statusEl = document.getElementById('modal-status');

  if(!name || !start || !end){
    statusEl.textContent = 'Name, start, and end are required.';
    statusEl.className = 'err';
    return;
  }
  if(timeToMinutes(end) <= timeToMinutes(start)){
    statusEl.textContent = 'End time must be after start time.';
    statusEl.className = 'err';
    return;
  }

  document.getElementById('modal-save').disabled = true;
  statusEl.textContent = 'Saving…';
  statusEl.className = '';

  const url = `${SCRIPT_URL}?mode=editActivity&day=${encodeURIComponent(day)}&index=${index}`
    + `&name=${encodeURIComponent(name)}&child=${encodeURIComponent(child)}`
    + `&type=${encodeURIComponent(type)}&start=${start}&end=${end}`;
  fetch(url, { mode: 'no-cors' }).catch(()=>{});

  confirmWrite(
    null,
    (d) => {
      const item = (d.activityOptions[day] || [])[index];
      return !!item && item.name===name && item.child===child && item.type===type && item.start===start && item.end===end;
    },
    () => {
      statusEl.textContent = 'Saved ✓';
      statusEl.className = 'ok';
      setTimeout(() => {
        closeActivityModal();
        load(); // full refresh so both timetables reflect the change
      }, 600);
    },
    () => {
      statusEl.textContent = "Didn't confirm — check your connection and try again.";
      statusEl.className = 'err';
      document.getElementById('modal-save').disabled = false;
    }
  );
});

function renderActivitiesTab(data){
  currentData = data;
  const filterBar = renderFilterBar(data);
  const legend = `<div class="tt-legend">
    <span class="tt-swatch" style="background:rgba(193,101,47,.5);border:1px solid var(--nollen)"></span>Nollen
    &nbsp;&nbsp;<span class="tt-swatch" style="background:rgba(59,110,143,.5);border:1px solid var(--austin)"></span>Austin
    &nbsp;&nbsp;<span class="tt-swatch" style="border:1px dashed #B8492F"></span>conflict (loses out to something else at that time)<br>
    Tell Claude about a new class, a dropped one, or a time change — this recalculates next load, no manual re-run needed.
  </div>`;

  const weekday = buildTimetable('📅 Weekdays · 2:30–8:30 pm', ['Monday','Tuesday','Wednesday','Thursday','Friday'], '14:30', '20:30', data);
  const weekend = buildTimetable('📅 Weekend · 8:00 am–2:00 pm', ['Saturday','Sunday'], '08:00', '14:00', data);

  document.getElementById('activities-panel').innerHTML =
    '<div class="section-label">⚙️ Activity Optimizer</div>' + filterBar + legend + weekday + weekend;
}

document.getElementById('tab-btn-week').addEventListener('click', () => {
  document.getElementById('tab-btn-week').classList.add('active');
  document.getElementById('tab-btn-activities').classList.remove('active');
  document.getElementById('main').style.display = '';
  document.getElementById('activities-panel').style.display = 'none';
});
document.getElementById('tab-btn-activities').addEventListener('click', () => {
  document.getElementById('tab-btn-activities').classList.add('active');
  document.getElementById('tab-btn-week').classList.remove('active');
  document.getElementById('main').style.display = 'none';
  document.getElementById('activities-panel').style.display = '';
});

async function load(){
  document.getElementById('main').innerHTML = '<div class="state-msg" id="loading">Loading schedule…</div>';
  try{
    const res = await fetch(RAW_JSON_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  }catch(err){
    renderError(`Could not load schedule.json (${err.message}).`);
  }
}

document.getElementById('refresh-btn').addEventListener('click', load);
load();
</script>
<div class="modal-overlay" id="activity-modal" style="display:none">
  <div class="modal-box">
    <h3>Edit Activity</h3>
    <label class="modal-field">Name<input type="text" id="modal-name"></label>
    <div class="modal-row">
      <label class="modal-field">Child
        <select id="modal-child"><option>Nollen</option><option>Austin</option></select>
      </label>
      <label class="modal-field">Type
        <select id="modal-type"><option>TKD</option><option>Parcor</option><option>Hockey</option><option>Other</option></select>
      </label>
    </div>
    <div class="modal-row">
      <label class="modal-field">Start<input type="time" id="modal-start"></label>
      <label class="modal-field">End<input type="time" id="modal-end"></label>
    </div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-save" class="primary">Save</button>
    </div>
    <div id="modal-status"></div>
  </div>
</div>
</body>
